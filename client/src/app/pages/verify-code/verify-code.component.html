<div class="auth-container">

  <h2>Verify Account</h2>

  <p>
    Enter the 6-digit code sent to
    {{ email }}
  </p>

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  @if (message) {
    <div class="success">
      {{ message }}
    </div>
  }

  <form (ngSubmit)="verify()">

    <input
      type="text"
      name="code"
      [(ngModel)]="code"
      maxlength="6"
      placeholder="Verification code"
      required
    />

    <button type="submit">
      Verify
    </button>

  </form>

  <button
    type="button"
    (click)="resend()"
  >
    Resend code
  </button>

</div>

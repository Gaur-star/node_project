<div class="auth-container">

  <h2>Reset Password</h2>

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  @if (message) {
    <div class="success">
      {{ message }}
    </div>
  }

  <form (ngSubmit)="submit()">

    <input
      type="text"
      name="code"
      [(ngModel)]="code"
      placeholder="Reset code"
      maxlength="6"
      required
    />

    <input
      type="password"
      name="password"
      [(ngModel)]="newPassword"
      placeholder="New password"
      minlength="8"
      required
    />

    <button type="submit">
      Reset password
    </button>

  </form>

</div>

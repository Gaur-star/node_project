<div class="auth-container">

  <h2>Forgot Password</h2>

  @if (message) {
    <div class="success">
      {{ message }}
    </div>
  }

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="submit()">

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Email"
      required
    />

    <button type="submit">
      Send reset code
    </button>

  </form>

</div>

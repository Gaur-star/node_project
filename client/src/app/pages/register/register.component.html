<div class="auth-container">

  <h2>Create Account</h2>

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="register()">

    <input
      type="text"
      name="name"
      [(ngModel)]="name"
      placeholder="Full name"
      required
    />

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Password"
      minlength="8"
      required
    />

    <!-- CAPTCHA goes here -->

    <button
      type="submit"
      [disabled]="loading"
    >
      {{ loading ? 'Creating...' : 'Create account' }}
    </button>

  </form>

  <p>
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>

</div>

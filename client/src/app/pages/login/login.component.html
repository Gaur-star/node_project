<div class="auth-container">

  <h2>Login</h2>

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="login()">

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Password"
      required
    />

    <button
      type="submit"
      [disabled]="loading"
    >
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

  </form>

  <p>
    <a routerLink="/register">
      Create account
    </a>
  </p>

  <p>
    <a routerLink="/forgot-password">
      Forgot password?
    </a>
  </p>

</div>
